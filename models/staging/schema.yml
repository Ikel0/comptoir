version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships: {to: ref('stg_customers'), field: customer_id}
      - name: order_status
        tests:
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
  - name: stg_order_items
    tests:
      - dbt_utils_free_unique_combination:
          columns: [order_id, order_item_id]
    columns:
      - name: order_id
        tests:
          - relationships: {to: ref('stg_orders'), field: order_id}
      - name: product_id
        tests:
          - relationships: {to: ref('stg_products'), field: product_id}
      - name: seller_id
        tests:
          - relationships: {to: ref('stg_sellers'), field: seller_id}
  - name: stg_order_reviews
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: review_score
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
  - name: stg_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: customer_unique_id
        tests: [not_null]
  - name: stg_sellers
    columns:
      - name: seller_id
        tests: [unique, not_null]
  - name: stg_products
    columns:
      - name: product_id
        tests: [unique, not_null]
